name: Scribe Error Report
description: Automated error report from a Scribe instance
title: "[ERROR] "
labels: ["scribe-error-report", "bug"]
body:
  - type: markdown
    attributes:
      value: |
        This is an automated error report generated by a Scribe instance.
        Do not edit the structured fields — they are machine-generated.

  - type: input
    id: scribe-version
    attributes:
      label: Scribe Version
      placeholder: "0.1.0"
    validations:
      required: true

  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Claude Code
        - Claude Desktop
        - Claude Web App
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: Operating System
      placeholder: "Darwin 23.6.0"

  - type: textarea
    id: errors
    attributes:
      label: Error Details
      description: Structured error data from the Scribe error log
      render: json
    validations:
      required: true

  - type: textarea
    id: system-conditions
    attributes:
      label: System Conditions
      description: Environment state at time of errors
      render: json

  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction Context
      description: What the user was doing when errors occurred
